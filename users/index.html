<script>
const hasil =
    document.getElementById("hasil");

let users = [];
let semuaUser = [];

let jumlahTampil = 20;
const perLoad = 20;


// =========================
// AMBIL DAFTAR USER
// =========================

fetch("data/users.json")

    .then(response => {

        console.log(
            "Status users.json:",
            response.status,
            response.statusText
        );

        console.log(
            "URL:",
            response.url
        );

        if (!response.ok) {

            throw new Error(
                "Gagal memuat users.json: HTTP " +
                response.status
            );
        }

        return response.json();
    })


    // =========================
    // PROSES USERS.JSON
    // =========================

    .then(data => {

        console.log(
            "Isi users.json:",
            data
        );


        const daftarUsername =
            data.users || [];


        console.log(
            "Jumlah username:",
            daftarUsername.length
        );


        // =========================
        // CARI FILE USER
        // =========================

        async function cariFileUser(username) {

            const file =
                `user/${encodeURIComponent(username)}.json`;


            try {

                const response =
                    await fetch(file);


                console.log(
                    "Cek:",
                    username,
                    response.status
                );


                if (!response.ok) {

                    console.log(
                        "JSON tidak ditemukan:",
                        file
                    );

                    return null;
                }


                const data =
                    await response.json();


                console.log(
                    "JSON DITEMUKAN:",
                    username
                );


                return data;

            } catch (error) {

                console.log(
                    "Gagal cek:",
                    file,
                    error
                );

                return null;
            }
        }


        // =========================
        // AMBIL SEMUA USER
        // =========================

        return Promise.all(

            daftarUsername.map(
                username =>
                    cariFileUser(
                        username
                    )
            )

        );

    })


    // =========================
    // HASIL SEMUA DATA
    // =========================

    .then(semuaData => {

        console.log(
            "Semua data:",
            semuaData
        );


        // =========================
        // HAPUS DATA GAGAL
        // =========================

        users =
            semuaData.filter(
                data =>
                    data !== null
            );


        // =========================
        // HAPUS DUPLIKAT ID
        // =========================

        const berdasarkanID =
            new Map();


        users.forEach(user => {

            if (!user) {
                return;
            }


            // =========================
            // TANPA ID
            // =========================

            if (!user.id) {

                const username =
                    (
                        user.name ||
                        user.username ||
                        ""
                    ).toLowerCase();


                berdasarkanID.set(
                    "username:" +
                    username,
                    user
                );


                return;
            }


            // =========================
            // BERDASARKAN ID ROBLOX
            // =========================

            const key =
                String(user.id);


            const dataLama =
                berdasarkanID.get(
                    key
                );


            if (!dataLama) {

                berdasarkanID.set(
                    key,
                    user
                );

                return;
            }


            // =========================
            // PILIH DATA TERBARU
            // =========================

            const waktuBaru =
                user.copiedAt
                    ? new Date(
                        user.copiedAt
                    ).getTime()
                    : 0;


            const waktuLama =
                dataLama.copiedAt
                    ? new Date(
                        dataLama.copiedAt
                    ).getTime()
                    : 0;


            if (
                waktuBaru >=
                waktuLama
            ) {

                berdasarkanID.set(
                    key,
                    user
                );
            }

        });


        // =========================
        // HASIL AKHIR
        // =========================

        users =
            Array.from(
                berdasarkanID.values()
            );


        console.log(
            "Jumlah user akhir:",
            users.length
        );


        // =========================
        // URUTKAN A-Z
        // =========================

        users.sort((a, b) => {

            const namaA =
                a.displayName ||
                a.name ||
                "";


            const namaB =
                b.displayName ||
                b.name ||
                "";


            return namaA.localeCompare(
                namaB,
                "id",
                {
                    sensitivity:
                        "base"
                }
            );
        });


        semuaUser =
            users;


        jumlahTampil =
            20;


        tampilAwal();

    })


    // =========================
    // ERROR
    // =========================

    .catch(error => {

        console.error(
            "JSON:",
            error
        );


        hasil.innerHTML =
            "<p>Data pengguna gagal dimuat.</p>";
    });

// =========================
// BUAT GAMBAR
// =========================

function buatGambar(
    user,
    displayName
) {

    const robloxImage =
        user.avatarHeadshotUrl ||
        "";


    // =========================
    // AMBIL TANGGAL DARI copiedAt
    // =========================

// =========================
// AMBIL TANGGAL ARSIP
// DARI copiedAt
// =========================

let tanggalArsip = "";

if (user.copiedAt) {

    const tanggal =
        new Date(user.copiedAt);

    if (!isNaN(tanggal.getTime())) {

        const tahun =
            tanggal.getUTCFullYear();

        const bulan =
            String(
                tanggal.getUTCMonth() + 1
            ).padStart(2, "0");

        const hari =
            tanggal.getUTCDate();

        // Hari 1-15 = tanggal 01
        // Hari 16+  = tanggal 16

        const hariArsip =
            hari >= 16
                ? "16"
                : "01";

        tanggalArsip =
            `${tahun}-${bulan}-${hariArsip}`;
    }
}


    // =========================
    // URL GAMBAR LOKAL
    // =========================

const localImage =
    user.id &&
    user.name &&
    tanggalArsip

        ? `https://robloxindonesia.github.io/users/data/${tanggalArsip}/assets/${encodeURIComponent(
            user.name
        )}/${user.id}-${encodeURIComponent(
            user.name
        )}-headshot.png`

        : "";


    console.log(
        "Gambar lokal:",
        localImage
    );


    // =========================
    // BUAT IMG
    // =========================

    const img =
        document.createElement(
            "img"
        );


    img.className =
        "img";


    img.width =
        70;


    img.height =
        70;


    img.alt =
        displayName;


    // =========================
    // GAMBAR UTAMA
    // =========================

    if (robloxImage) {

        img.src =
            robloxImage;

    } else if (localImage) {

        img.src =
            localImage;
    }


    // =========================
    // FALLBACK KE GAMBAR LOKAL
    // =========================

    img.onerror =
        function() {

            if (
                this.src ===
                    robloxImage &&
                localImage
            ) {

                this.src =
                    localImage;

                return;
            }


            this.onerror =
                null;


            console.log(
                "Gambar gagal:",
                this.src
            );
        };


    return img;
}



// =========================
// TAMPILKAN USER
// =========================

function tampil(
    data,
    reset = true
) {

    if (reset) {

        hasil.innerHTML =
            "";
    }


    data.forEach(user => {

        const username =
            user.name || "";


        const displayName =
            user.displayName ||
            username;


        // =========================
        // LINK
        // =========================

        const link =
            document.createElement(
                "a"
            );


        link.href =
            "profil.html?user=" +
            encodeURIComponent(
                username.toLowerCase()
            );


        link.style.textDecoration =
            "none";


        link.style.color =
            "black";


        // =========================
        // USER
        // =========================

        const userElement =
            document.createElement(
                "div"
            );


        userElement.className =
            "user";


        // =========================
        // GAMBAR
        // =========================

        const gambar =
            buatGambar(
                user,
                displayName
            );


        // =========================
        // INFO
        // =========================

        const info =
            document.createElement(
                "div"
            );


        info.className =
            "info";


        // =========================
        // NAMA
        // =========================

        const h3 =
            document.createElement(
                "h3"
            );


        h3.textContent =
            displayName;


        // =========================
        // VERIFIED
        // =========================

        if (
            user.hasVerifiedBadge ===
            true
        ) {

            const verified =
                document.createElement(
                    "img"
                );


            verified.src =
                "/iconsvg/certified.svg";


            verified.width =
                15;


            verified.height =
                15;


            verified.alt =
                "Verified";


            h3.appendChild(
                document.createTextNode(
                    " "
                )
            );


            h3.appendChild(
                verified
            );
        }


        // =========================
        // USERNAME
        // =========================

        const usernameElement =
            document.createElement(
                "p"
            );


        usernameElement.textContent =
            "@" +
            username;


        // =========================
        // SUSUN
        // =========================

        info.appendChild(
            h3
        );


        info.appendChild(
            usernameElement
        );


        userElement.appendChild(
            gambar
        );


        userElement.appendChild(
            info
        );


        link.appendChild(
            userElement
        );


        hasil.appendChild(
            link
        );

    });
}


// =========================
// TAMPIL AWAL
// =========================

function tampilAwal() {

    hasil.innerHTML =
        "";


    tampil(
        semuaUser.slice(
            0,
            jumlahTampil
        ),
        false
    );
}


// =========================
// LOAD SAAT SCROLL
// =========================

window.addEventListener(
    "scroll",
    () => {

        if (
            window.innerHeight +
            window.scrollY >=
            document.body.offsetHeight -
            100
        ) {

            if (
                jumlahTampil <
                semuaUser.length
            ) {

                const lama =
                    jumlahTampil;


                jumlahTampil +=
                    perLoad;


                tampil(
                    semuaUser.slice(
                        lama,
                        jumlahTampil
                    ),
                    false
                );
            }
        }
    }
);


// =========================
// PENCARIAN
// =========================

const search =
    document.getElementById(
        "search"
    );


if (search) {

    search.addEventListener(
        "input",
        function() {

            const cari =
                this.value
                    .toLowerCase()
                    .trim();


            semuaUser =
                users.filter(
                    user => {

                        const displayName =
                            (
                                user.displayName ||
                                ""
                            )
                            .toLowerCase();


                        const username =
                            (
                                user.name ||
                                ""
                            )
                            .toLowerCase();


                        return (
                            displayName.includes(
                                cari
                            ) ||

                            username.includes(
                                cari
                            )
                        );
                    }
                );


            jumlahTampil =
                20;


            tampilAwal();
        }
    );
}

</script>
