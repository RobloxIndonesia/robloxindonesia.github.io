<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unicode Bold Converter</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
}

textarea {
    width: 100%;
    min-height: 120px;
    padding: 12px;
    box-sizing: border-box;
    font-size: 18px;
    resize: vertical;
}

#hasil {
    margin-top: 15px;
    padding: 15px;
    min-height: 50px;
    border: 1px solid #ccc;
    white-space: pre-wrap;
    overflow-wrap: break-word;
}
</style>
</head>

<body>

<h2>Unicode Sans Bold Converter</h2>

<textarea
    id="input"
    placeholder="Ketik teks biasa..."
></textarea>

<div id="hasil"></div>

<script>

const normal = Array.from(
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"
);

const bold = Array.from(
    "𝗔𝗕𝗖𝗗𝗘𝗙𝗚𝗛𝗜𝗝𝗞𝗟𝗠𝗡𝗢𝗣𝗤𝗥𝗦𝗧𝗨𝗩𝗪𝗫𝗬𝗭" +
    "𝗮𝗯𝗰𝗱𝗲𝗳𝗴𝗵𝗶𝗷𝗸𝗹𝗺𝗻𝗼𝗽𝗾𝗿𝘀𝘁𝘂𝘃𝘄𝘅𝘆𝘇" +
    "𝟬𝟭𝟮𝟯𝟰𝟱𝟲𝟳𝟴𝟵"
);

// Cek agar jumlah karakter benar
console.log("Normal:", normal.length);
console.log("Bold:", bold.length);

// Membuat tabel konversi
const converter = new Map();

normal.forEach((karakter, index) => {
    converter.set(karakter, bold[index]);
});

function ubahTeks(teks) {

    let hasil = "";

    // Array.from() menjaga emoji dan Unicode
    for (const karakter of Array.from(teks)) {

        if (converter.has(karakter)) {
            hasil += converter.get(karakter);
        } else {
            // Karakter yang tidak tersedia dibiarkan
            hasil += karakter;
        }
    }

    return hasil;
}

const input = document.getElementById("input");
const hasil = document.getElementById("hasil");

input.addEventListener("input", () => {
    hasil.textContent = ubahTeks(input.value);
});

</script>

</body>
</html>
